#  Not a library: a place to run GNATprove from, so that the wuffs_ada
#  crate itself does not make its users download a prover.
#
#    cd ada/prove && alr exec -- gnatprove -P ../wuffs_token.gpr
name = "wuffs_ada_prove"
description = "Runs GNATprove on wuffs_ada's proved libraries"
version = "0.1.0-dev"
licenses = "Apache-2.0 OR MIT"
maintainers = ["Aldo Nicolas Bruno <ovenpasta@pizzahack.eu>"]
maintainers-logins = ["ovenpasta"]

[[depends-on]]
gnat = ">=16"
gnatprove = "^16.1.0"
